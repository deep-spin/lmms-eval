dataset_path: CohereForAI/AyaVisionBench
dataset_name: zho_Hans
task: aya-vision-bench-gen-zh
test_split: test
output_type: generate_until

process_docs: !function utils.process_docs
doc_to_visual: !function utils.gen_doc_to_visual
doc_to_text: !function utils.gen_doc_to_text
doc_to_target: ""
process_results: !function utils.gen_process_results


generation_kwargs:
  max_new_tokens: 1024
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false

metric_list:
  - metric: results
    aggregation: !function utils.aggregate_results


metadata:
  - version: 0.0

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Answer:"



