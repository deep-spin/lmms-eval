doc_to_target: ""
process_docs: !function utils.process_docs
doc_to_text: !function utils.doc_to_text
doc_to_visual: !function utils.doc_to_visual
doc_to_choice: !function utils.doc_to_choice
process_results: !function utils.process_results

lmms_eval_specific_kwargs:
  default:
    pre_prompt: "For the given Multiple Choice Question Answer below, analyze the question and answer strictly from one of the options below. Strictly answer with the correct text only. No additional text.\n"
